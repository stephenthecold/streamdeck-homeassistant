name: CI

# Build, lint and validate the plugin on pushes and pull requests.
on:
  push:
    branches: [legacy-3.5.x, develop, master]
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs

      - name: Build
        run: npm run build

      - name: Streamdeck Validate
        run: npm run validate
